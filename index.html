<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      %SITE_URL% comes from SITE_URL in vite.config.js (your domain, no "/" at the end).
      Link previews on WhatsApp / Facebook / LinkedIn need the full address of og-image.png.
    -->
    <title>Hamza Hashma | Software Developer · حمزة هشمة</title>
    <meta name="description" content="Hamza Hashma, software developer in Damascus. Computer Science graduate (GPA 3.99), builder of Team Flow for the Damascus International Airport project, and co-founder of Infinity Team. حمزة هشمة، مطوّر برمجيات في دمشق." />
    <meta name="author" content="Hamza Hashma" />
    <meta name="theme-color" content="#F3F1EC" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link preview (WhatsApp, Facebook, LinkedIn, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hamza Hashma" />
    <meta property="og:title" content="Hamza Hashma, Software Developer" />
    <meta property="og:description" content="I build software people rely on, and help others learn to build it. Projects, experience and awards. حمزة هشمة، مطوّر برمجيات." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hamza Hashma, Software Developer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hamza Hashma, Software Developer" />
    <meta name="twitter:description" content="I build software people rely on, and help others learn to build it." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hamza Hashma",
        "alternateName": "حمزة هشمة",
        "jobTitle": "Software Developer",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og-image.png",
        "email": "mailto:hamzaheshmeh9@gmail.com",
        "worksFor": { "@type": "Organization", "name": "ASIK Engineering Construction" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Lebanese International University" },
        "address": { "@type": "PostalAddress", "addressLocality": "Damascus", "addressCountry": "SY" },
        "sameAs": ["https://www.linkedin.com/in/hamza-hashma"],
        "knowsAbout": ["Software development", "Flutter", "React", "Node.js", "Data analysis", "Artificial intelligence"]
      }
    </script>

    <!-- Apply the saved theme before the page paints (no white/dark flash) -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("lang");
        if (l === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hamza Hashma",
        "alternateName": "حمزة هشمة",
        "jobTitle": "Software Developer",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og-image.png",
        "email": "mailto:hamzaheshmeh9@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Damascus", "addressCountry": "SY" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Lebanese International University" },
        "knowsLanguage": ["ar", "en"],
        "sameAs": ["https://www.linkedin.com/in/hamza-hashma"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif">Hamza Hashma, Software Developer. hamzaheshmeh9@gmail.com</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
